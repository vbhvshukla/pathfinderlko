<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS home-screen install support (Android/Chrome read these from the web app manifest instead) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pathfinder" />
    <title>Pathfinder – Best NGO & Psychologist in Lucknow | Counselling Services</title>
    <meta name="description" content="Pathfinder is a trusted NGO in Lucknow offering psychological counselling, career guidance and mental wellness workshops for students and families. Led by Dr. Sandhya Dwivedi. Book a session today." />
    <meta name="keywords" content="psychologist in Lucknow, NGO in Lucknow, best NGO in Lucknow, counselling in Lucknow, career counselling Lucknow, mental health NGO Lucknow, Dr. Sandhya Dwivedi, Pathfinder Lucknow" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pathfinderlko.in/" />

    <!-- Open Graph / social link previews (crawled statically, before JS runs) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pathfinder" />
    <meta property="og:title" content="Pathfinder – Best NGO & Psychologist in Lucknow" />
    <meta property="og:description" content="Trusted NGO in Lucknow offering psychological counselling, career guidance and mental wellness workshops. Led by Dr. Sandhya Dwivedi." />
    <meta property="og:url" content="https://pathfinderlko.in/" />
    <meta property="og:image" content="https://pathfinderlko.in/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Site-wide entity data for local search (Google local pack, knowledge panel).
         Kept static here (not injected via JS) so it's present in the raw HTML crawl,
         since crawlers and social-link bots don't reliably wait for the React app to mount. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["NGO", "LocalBusiness"],
      "name": "Pathfinder",
      "alternateName": "Pathfinder NGO Lucknow",
      "description": "Pathfinder is a Lucknow-based NGO, operating under Brigupyari Seva Samiti, offering psychological counselling, career guidance, and mental wellness workshops for students and families.",
      "url": "https://pathfinderlko.in/",
      "logo": "https://pathfinderlko.in/icons/icon-512.png",
      "image": "https://pathfinderlko.in/icons/icon-512.png",
      "telephone": "+91-9794940394",
      "email": "pathfinder.lko2710@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "206/207-A Mod Galaxy City, Near Omaxe City, Bijnaur Road",
        "addressLocality": "Lucknow",
        "addressRegion": "Uttar Pradesh",
        "addressCountry": "IN"
      },
      "areaServed": { "@type": "City", "name": "Lucknow" },
      "founder": {
        "@type": "Person",
        "name": "Dr. Sandhya Dwivedi",
        "jobTitle": "Director & Chief Counselling Psychologist",
        "sameAs": ["https://www.linkedin.com/in/dr-sandhya-dwivedi-a073401b1/"]
      },
      "sameAs": [
        "https://www.facebook.com/p/Pathfinder-Lucknow-100064046493210/",
        "https://www.instagram.com/pathfinder_lko/"
      ]
    }
    </script>
    <style>
      /* Shown immediately on launch, before the JS bundle loads/parses, so the
         home-screen app never shows a blank flash — this is what iOS paints
         first when opened from "Add to Home Screen". Removed by main.jsx once
         React has mounted. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 0.25s ease;
      }
      #app-splash img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        animation: app-splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes app-splash-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.94); }
      }
      #app-splash.app-splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash"><img src="/icons/icon-192.png" alt="" /></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
